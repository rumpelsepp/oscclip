name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run lint
        run: uv run just lint
      - name: Run typecheck
        run: uv run just typecheck
      - name: Run tests
        run: uv run just test
