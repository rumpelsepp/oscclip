name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run ty check
      - run: uv run pytest
      # Short coverage-guided fuzzing smoke run of the parsers.
      - run: uv run python -m fuzz.fuzz_parsers fuzz/corpus -max_total_time=30 -artifact_prefix=/tmp/fuzz-crashes/
