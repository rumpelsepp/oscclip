[project]
name = "oscclip"
version = "0.6.0"
description = "Access the system clipboard via terminal escape sequences (OSC 52 and the kitty clipboard protocol)"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Stefan Tatschner", email = "stefan@rumpelsepp.org" },
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/rumpelsepp/oscclip"
Issues = "https://github.com/rumpelsepp/oscclip/issues"
Changelog = "https://github.com/rumpelsepp/oscclip/blob/master/CHANGELOG.md"

[project.scripts]
osc-copy = "oscclip.osc_copy:main"
osc-paste = "oscclip.osc_paste:main"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=8.4",
    "ruff>=0.17",
    "ty>=0.0.94",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins: don't shadow builtins
    "B",    # flake8-bugbear: common bug patterns
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors (incl. E501)
    "F",    # pyflakes
    "I",    # isort
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint umbrella
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific (incl. ambiguous unicode detection)
    "SIM",  # flake8-simplify
    "T10",  # flake8-debugger
    "T20",  # flake8-print: protocol code must not write to stdout
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# These modules implement the CLI output; print is intentional here.
"src/oscclip/cli.py" = ["T201"]
"src/oscclip/osc_copy.py" = ["T201"]
"src/oscclip/osc_paste.py" = ["T201"]
"src/oscclip/mux.py" = ["T201"]

[tool.mypy]
strict = true
num_workers = "auto"
files = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
